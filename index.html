<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotinas — IZE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#E8E8E8;
    --white:#FFFFFF;
    --orange:#EB571C;
    --black:#252422;
    --avatar:#171717;
    --beige:#D5D2CC;
    --track:#F6F6F6;
    --fill-neutral:#D5D8DF;
    --green:#1F6B45;
    --text:#1A1A1A;
    --muted:#8A857F;
    --radius-lg:2.2vh;
    --radius-md:1.35vh;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    font-family:'Poppins',sans-serif;
    color:var(--text);
  }

  .page{
    height:100vh;
    width:100vw;
    display:grid;
    grid-template-rows:auto 18.5fr 38fr 19.5fr;
    gap:1.7vh;
    padding:2.4vh 3vw;
  }

  /* label row */
  .label-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:1vh;
  }
  .eyebrow{
    font-size:1.35vh;
    font-weight:700;
    letter-spacing:.12em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .actions{
    display:flex;
    align-items:center;
    gap:0.7vw;
  }
  .updated-tag{
    background:var(--white);
    border-radius:999px;
    padding:0.8vh 1.2vw;
    font-size:1.15vh;
    color:var(--muted);
    font-weight:500;
    white-space:nowrap;
  }
  .icon-btn{
    width:3.4vh;height:3.4vh;
    border-radius:50%;
    border:none;
    background:var(--white);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--text);
    text-decoration:none;
    flex-shrink:0;
  }
  .icon-btn svg{width:1.5vh;height:1.5vh;}

  /* top row: 3 periodicity cards */
  .top-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1.6vw;
    min-height:0;
  }
  .tcard{
    border-radius:var(--radius-lg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0.8vh;
    text-align:center;
    padding:1vh;
  }
  .tcard.orange{background:var(--orange);color:#fff;}
  .tcard.black{background:var(--black);color:#fff;}
  .tcard.beige{background:var(--beige);color:var(--text);}
  .tcard .label{
    font-size:1.5vh;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    opacity:.85;
  }
  .tcard .pct{
    font-size:7vh;
    font-weight:800;
    line-height:1;
  }
  .tcard .sub{
    font-size:1.4vh;
    opacity:.75;
    font-weight:500;
  }

  /* generic big white panel */
  .panel{
    background:var(--white);
    border-radius:var(--radius-lg);
    padding:2.2vh 2vw;
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
  }
  .panel h3{
    margin:0 0 1.6vh;
    font-size:1.75vh;
    font-weight:700;
    color:var(--text);
    flex:0 0 auto;
  }

  /* historico bars */
  .bars-wrap{
    flex:1 1 auto;
    display:flex;
    align-items:stretch;
    gap:1.4vw;
    min-height:0;
  }
  .bar-col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1vh;
    min-width:0;
  }
  .bar-col .bar-pct{
    font-size:1.5vh;
    color:var(--muted);
    font-weight:600;
  }
  .bar-col.active .bar-pct{color:var(--text);font-weight:800;}
  .bar-track{
    flex:1;
    width:100%;
    max-width:5vw;
    background:var(--track);
    border-radius:var(--radius-md);
    display:flex;
    align-items:flex-end;
    overflow:hidden;
    min-height:0;
  }
  .bar-fill{
    width:100%;
    background:var(--fill-neutral);
    border-radius:var(--radius-md);
    min-height:6px;
  }
  .bar-col.active .bar-fill{background:var(--orange);}
  .bar-col .bar-day{
    font-size:1.4vh;
    color:var(--muted);
    font-weight:600;
  }
  .bar-col.active .bar-day{color:var(--text);font-weight:800;}

  /* ontem / equipe chips */
  .team-grid{
    flex:1 1 auto;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px,1fr));
    gap:1.2vh 1.2vw;
    align-content:start;
    overflow:hidden;
  }
  .team-chip{
    background:var(--track);
    border-radius:var(--radius-md);
    padding:1.3vh 1.4vw;
    display:flex;
    align-items:center;
    gap:1vw;
    min-width:0;
  }
  .team-chip .avatar{
    width:4.2vh;height:4.2vh;
    border-radius:50%;
    background:var(--avatar);
    color:#fff;
    font-size:1.4vh;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .team-chip .name{
    font-size:1.6vh;
    font-weight:700;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .team-chip .pct{
    font-size:1.7vh;
    font-weight:800;
    color:var(--green);
    flex-shrink:0;
  }

  .empty{
    color:var(--muted);
    font-size:1.4vh;
    margin:auto;
  }

  .error-box{
    position:fixed;
    top:2vh;left:50%;
    transform:translateX(-50%);
    background:#FBD9CC;
    color:#7A2B12;
    border-radius:14px;
    padding:1.2vh 1.6vw;
    font-size:1.3vh;
    display:none;
    z-index:10;
    box-shadow:0 8px 24px rgba(0,0,0,.12);
  }
  .error-box button{
    margin-left:10px;
    background:var(--black);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:5px 12px;
    font-size:1.1vh;
    cursor:pointer;
    font-family:inherit;
  }
</style>
</head>
<body>
<div class="error-box" id="errorBox">
  Não foi possível carregar os dados. Confira o compartilhamento da planilha.
  <button id="retryBtn">Tentar de novo</button>
</div>

<div class="page">

  <div class="label-row">
    <span class="eyebrow">Rotinas · Monday</span>
    <div class="actions">
      <span class="updated-tag" id="updatedTag">carregando...</span>
      <button class="icon-btn" id="refreshBtn" title="Atualizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path></svg>
      </button>
      <a class="icon-btn" id="downloadBtn" title="Baixar planilha" href="#" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </a>
    </div>
  </div>

  <div class="top-row" id="topRow">
    <div class="tcard orange"><div class="label">Diário</div><div class="pct">—</div><div class="sub">carregando...</div></div>
    <div class="tcard black"><div class="label">Semanal</div><div class="pct">—</div><div class="sub">carregando...</div></div>
    <div class="tcard beige"><div class="label">Mensal</div><div class="pct">—</div><div class="sub">carregando...</div></div>
  </div>

  <div class="panel">
    <h3>Histórico da semana</h3>
    <div class="bars-wrap" id="barsChart">
      <div class="empty">carregando...</div>
    </div>
  </div>

  <div class="panel">
    <h3>Ontem</h3>
    <div class="team-grid" id="teamGrid">
      <div class="empty">carregando...</div>
    </div>
  </div>

</div>

<script>
const SHEET_ID = "1BG7MgKomzCf4P3UwVIfHq4AlNiHO0msTDvFUtSuAZ7Y";
const GID = "614964491";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;
const XLSX_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx`;
const DIAS_SEMANA = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];

document.getElementById("downloadBtn").href = XLSX_URL;

function stripAccents(s){
  return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").trim().toLowerCase();
}

function parseDateBR(s){
  if(!s) return null;
  const parts = s.trim().split("/");
  if(parts.length !== 3) return null;
  const [d,m,y] = parts.map(Number);
  if(!d || !m || !y) return null;
  return new Date(y, m-1, d);
}

function formatDateBR(date){
  if(!date) return "—";
  const d = String(date.getDate()).padStart(2,"0");
  const m = String(date.getMonth()+1).padStart(2,"0");
  return `${d}/${m}`;
}

function isFeito(status){
  return stripAccents(status) === "feito";
}

function initials(name){
  const parts = (name||"").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  const first = parts[0][0] || "";
  const second = parts.length > 1 ? (parts[1][0] || "") : "";
  return (first+second).toUpperCase();
}

function normalizeRows(raw){
  return raw
    .filter(r => r.elemento && r.periodicidade)
    .map(r => ({
      id: r.id_item,
      elemento: r.elemento,
      periodicidade: stripAccents(r.periodicidade),
      status: r.status_antigo,
      feito: isFeito(r.status_antigo),
      dateAntigo: parseDateBR(r.data_previsao_antigo),
      dateNovo: parseDateBR(r.data_previsao_novo),
      responsavel: (r.responsavel||"").trim()
    }))
    .filter(r => r.dateAntigo);
}

function periodRows(rows, periodKey){
  return rows.filter(r => r.periodicidade === periodKey);
}

// pega, por id_item, o lançamento mais recente dentro da periodicidade —
// evita depender de todos os itens compartilharem a mesma data (semanal/mensal
// têm vencimentos individuais, escalonados por item).
function latestPerItem(rows, periodKey){
  const pr = periodRows(rows, periodKey);
  const map = new Map();
  pr.forEach(r => {
    const key = r.id || r.elemento;
    const cur = map.get(key);
    if(!cur || r.dateAntigo > cur.dateAntigo) map.set(key, r);
  });
  return [...map.values()];
}

function summaryFor(rows, periodKey){
  const latest = latestPerItem(rows, periodKey);
  const feitas = latest.filter(r => r.feito).length;
  const total = latest.length;
  return {pct: total ? Math.round((feitas/total)*100) : null, feitas, total};
}

function latestDateOf(rows){
  if(!rows.length) return null;
  return rows.reduce((max,r) => r.dateAntigo > max ? r.dateAntigo : max, rows[0].dateAntigo);
}

function uniqueDatesDesc(rows, periodKey, limit){
  const pr = periodRows(rows, periodKey);
  const seen = new Map();
  pr.forEach(r => {
    const key = r.dateAntigo.getTime();
    if(!seen.has(key)) seen.set(key, r.dateAntigo);
  });
  return [...seen.values()].sort((a,b) => b-a).slice(0, limit);
}

function pctForDate(rows, periodKey, date){
  const cycle = periodRows(rows, periodKey).filter(r => r.dateAntigo.getTime() === date.getTime());
  const feitas = cycle.filter(r => r.feito).length;
  const total = cycle.length;
  return {pct: total ? Math.round((feitas/total)*100) : 0, feitas, total};
}

function teamBreakdown(rows){
  const pr = periodRows(rows, "diario");
  const latest = latestDateOf(pr);
  if(!latest) return [];
  const cycle = pr.filter(r => r.dateAntigo.getTime() === latest.getTime());
  const map = new Map();
  cycle.forEach(r => {
    const key = r.responsavel || "Sem responsável";
    if(!map.has(key)) map.set(key, {name:key, feitas:0, total:0});
    const o = map.get(key);
    o.total++;
    if(r.feito) o.feitas++;
  });
  return [...map.values()]
    .map(o => ({...o, pct: o.total ? Math.round((o.feitas/o.total)*100) : 0}))
    .sort((a,b) => b.pct - a.pct);
}

function render(rows){
  const dia = summaryFor(rows, "diario");
  const sem = summaryFor(rows, "semanal");
  const mes = summaryFor(rows, "mensal");

  document.getElementById("topRow").innerHTML = `
    <div class="tcard orange">
      <div class="label">Diário</div>
      <div class="pct">${dia.pct === null ? "—" : dia.pct+"%"}</div>
      <div class="sub">${dia.total ? dia.feitas+"/"+dia.total+" feitas" : "sem dados ainda"}</div>
    </div>
    <div class="tcard black">
      <div class="label">Semanal</div>
      <div class="pct">${sem.pct === null ? "—" : sem.pct+"%"}</div>
      <div class="sub">${sem.total ? sem.feitas+"/"+sem.total+" feitas" : "sem dados ainda"}</div>
    </div>
    <div class="tcard beige">
      <div class="label">Mensal</div>
      <div class="pct">${mes.pct === null ? "—" : mes.pct+"%"}</div>
      <div class="sub">${mes.total ? mes.feitas+"/"+mes.total+" feitas" : "sem dados ainda"}</div>
    </div>
  `;

  // historico da semana (ultimos 5 dias diarios registrados)
  const dailyDates = uniqueDatesDesc(rows, "diario", 5).reverse();
  const barsEl = document.getElementById("barsChart");
  if(!dailyDates.length){
    barsEl.innerHTML = `<div class="empty">Sem histórico diário ainda.</div>`;
  } else {
    const mostRecent = dailyDates[dailyDates.length-1].getTime();
    barsEl.innerHTML = dailyDates.map(date => {
      const s = pctForDate(rows, "diario", date);
      const isActive = date.getTime() === mostRecent;
      const dayLabel = DIAS_SEMANA[date.getDay()];
      return `
        <div class="bar-col ${isActive ? 'active':''}" title="${formatDateBR(date)} — ${s.feitas}/${s.total} feitas">
          <div class="bar-pct">${s.pct}%</div>
          <div class="bar-track"><div class="bar-fill" style="height:${Math.max(s.pct,4)}%"></div></div>
          <div class="bar-day">${dayLabel}</div>
        </div>
      `;
    }).join("");
  }

  // ontem — por responsavel
  const team = teamBreakdown(rows);
  const teamGrid = document.getElementById("teamGrid");
  if(!team.length){
    teamGrid.innerHTML = `<div class="empty">Ainda não há um dia diário fechado para mostrar por responsável.</div>`;
  } else {
    teamGrid.innerHTML = team.map(t => `
      <div class="team-chip">
        <div class="avatar">${initials(t.name)}</div>
        <div class="name">${t.name}</div>
        <div class="pct">${t.pct}%</div>
      </div>
    `).join("");
  }

  document.getElementById("updatedTag").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("errorBox").style.display = "none";
}

function load(){
  document.getElementById("updatedTag").textContent = "carregando...";
  fetch(CSV_URL, {cache:"no-store"})
    .then(res => {
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(text => {
      const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
      const rows = normalizeRows(parsed.data);
      render(rows);
    })
    .catch(err => {
      console.error(err);
      document.getElementById("errorBox").style.display = "block";
      document.getElementById("updatedTag").textContent = "falha ao atualizar";
    });
}

document.getElementById("refreshBtn").addEventListener("click", load);
document.getElementById("retryBtn").addEventListener("click", load);

load();

// auto-refresh a cada 10 minutos, util pra deixar rodando na TV
setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
